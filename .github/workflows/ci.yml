# Phase 4 (N-04): CI locks the regression floor — the lint/format/typecheck
# gates run on every push/PR, the full Electron battery on main pushes,
# nightly, and manual dispatch. Roadmap: "Gate on main; nightly full battery
# with artifacts on failure."
#
# Cost note: macos runners bill 10x Linux minutes, so the heavy battery does
# NOT run on PRs — gates do. Main-process-touching PRs additionally get a
# cheap automatic subset (scripts/pr-subset.sh: boot + cto + reveal). A PR
# that needs the full battery can get it via a push to main, a manual
# dispatch, or the `battery` label (documented tradeoff, not an oversight).
#
# Environment risks (fix-forward, see log on red):
# - Electron smoke opens real BrowserWindows. macOS runners have a WindowServer
#   and this works for most Electron projects, but if suites fail with
#   display errors the fix is a headless flag in scripts/smoke-all.sh's
#   electron_run (e.g. --headless=new where supported), not deleting suites.
# - First battery run on a cold model cache downloads SigLIP weights (~370MB)
#   plus tesseract CDN data; the actions/cache below makes later runs fast.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `labeled` lets the `battery` label request the full battery on a PR
    # (condition on the battery job below); the other three are the default
    # PR activity types, listed so adding `labeled` doesn't drop them.
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Nightly full battery, 06:00 UTC.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  # Superseded pushes cancel their own gates; the battery never cancels —
  # a half-run battery proves nothing.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    name: lint / format / typecheck / unit
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Production dependency audit
        run: bun run test:audit-runtime

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      # dist-main/ is generated (gitignored). The directory run below includes
      # the main-load harness, the IPC bridge and the transcribe-worker smoke
      # test, all of which load the compiled mirror — so build it first, or a
      # fresh checkout fails those files before the later build step runs.
      - name: Build main process (dist-main)
        run: bun run build:main

      - name: Unit tests (bun:test suite)
        run: bun test test/

      - name: Unit tests (scene planning)
        run: bun run test:planning

      - name: Unit tests (import order)
        run: bun run test:import-order

      - name: Unit tests (MIME sniffing)
        run: bun run test:mime-sniff

      - name: Unit tests (packaged-files guard)
        run: bun run test:packaged-files

      - name: Unit tests (main-load harness)
        run: bun run test:main-load

      - name: Unit tests (IPC bridge drift)
        run: bun run test:ipc-bridge

      - name: Unit tests (tokenization parity)
        run: bun run test:token-parity

      - name: Unit tests (IPC failure normalization)
        run: bun run test:ipc-error

      - name: Unit tests (media order)
        run: bun run test:media-order

      - name: Unit tests (pump enrichment)
        run: bun run test:pump-enrichment

      - name: Unit tests (pump transcription)
        run: bun run test:pump-transcription

      - name: Unit tests (transcript fusion)
        run: bun run test:transcript-fusion

      - name: Unit tests (transcript deep)
        run: bun run test:transcript-deep

      - name: Unit tests (dialogue rank)
        run: bun run test:transcript-dialogue-rank

      - name: Unit tests (audio probe)
        run: bun run test:transcribe-audio-probe

      - name: Unit tests (whisper model)
        run: bun run test:whisper-model

      - name: Unit tests (dialogue exact)
        run: bun run test:dialogue-exact

      # youtube.test.js pins the pure parser/argv/staging helpers plus the
      # main-process seam names; the Electron battery then drives the real
      # download path (ELECTRON_SMOKE_YOUTUBE).
      - name: Unit tests (YouTube agent helpers)
        run: bun run test:youtube

      # The Ask sidecar lifecycle (spawn, health poll, unknown-flag retry,
      # stop-mid-start) — the sidecar suite is a node-style file, so it only
      # runs to completion via `bun run` (bun test abandons its async work).
      - name: Unit tests (Ask sidecar lifecycle)
        run: bun run test:ask

      # Tracked main-process children: the quit sweep must kill what it owns.
      - name: Unit tests (child registry)
        run: bun run test:child-registry

  changes:
    name: changed paths
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: filter
        name: Main-process paths touched?
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CHANGED="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(main/|main-lib/|indexer/|shared/|scripts/|main\.js$|main\.ts$|preload\.js|screenshot-probe\.js|package\.json|tsconfig[^/]*\.json|vite\.config\.ts|\.github/workflows/ci\.yml)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  pr-subset:
    name: PR subset (main-process smoke)
    # Automatic for PRs that touch main-process paths; needs gates green
    # first so a lint typo never burns macOS runner minutes.
    needs: [changes, gates]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: ~/Library/Application Support/scm/models
          key: ${{ runner.os }}-scm-models-${{ hashFiles('indexer/models.ts', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-scm-models-

      - name: PR subset (boot + cto + reveal)
        run: bash scripts/pr-subset.sh

      - name: Packaged size / payload guard
        # pr-subset.sh already built the --dir layout and booted it.
        run: SCM_REQUIRE_PACKAGED=1 bun run test:packaged-size

      - name: Upload subset log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scm-pr-subset-log
          path: /tmp/scm-pr-subset.log
          retention-days: 14

  battery:
    name: full smoke battery
    # Main pushes, nightly schedule, manual dispatch — plus PRs carrying the
    # `battery` label (see the pull_request types above). Never plain PRs.
    # The label is checked by PRESENCE, not by the `labeled` event alone: a
    # push to a labeled PR (synchronize) must keep running the battery, not
    # silently skip it (the 0.2.13 release PR hid exactly that).
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'battery')
    needs: gates
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore model cache
        uses: actions/cache@v4
        with:
          # scripts/smoke-all.sh symlinks exactly this path into every
          # suite's temp data dir; a cold cache just downloads on demand.
          path: ~/Library/Application Support/scm/models
          key: ${{ runner.os }}-scm-models-${{ hashFiles('indexer/models.ts', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-scm-models-

      - name: Full battery
        run: bash scripts/smoke-all.sh

      - name: Packaged size / payload guard
        run: |
          CSC_IDENTITY_AUTO_DISCOVERY=false bunx electron-builder --mac --dir
          SCM_REQUIRE_PACKAGED=1 bun run test:packaged-size

      - name: Upload battery log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scm-battery-log
          path: /tmp/scm-battery.log
          retention-days: 14
