version: 2
updates:
  # The project is Bun-managed (`bun.lock`). The npm ecosystem cannot update
  # bun.lock; Dependabot's `bun` ecosystem can.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      runtime-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Electron majors change Chromium/Node APIs; take those deliberately.
      - dependency-name: "electron"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
